<section class="checkout">

  <h2 class="title">Secure Checkout</h2>

  <div class="checkout-grid">

    <!-- ADDRESS SECTION -->
    <div class="address-box">

      <div class="step-header">
        <i class="fa-solid fa-location-dot"></i>
        <h3>Shipping Details</h3>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input placeholder="+91 XXXXX XXXXX">
      </div>

      <div class="form-group">
        <label>House / Street</label>
        <input placeholder="Flat 101, Main Road">
      </div>

      <div class="form-group">
        <label>City</label>
        <input placeholder="Coimbatore">
      </div>

      <div class="form-group">
        <label>Pincode</label>
        <input placeholder="641001">
      </div>

      <div class="step-header">
        <i class="fa-solid fa-wallet"></i>
        <h3>Payment Method</h3>
      </div>

      <div class="payment-options">

        <label class="pay-card">
          <input type="radio" name="pay" value="cod" checked>
          <div class="content">
            <i class="fa-solid fa-money-bill-wave"></i>
            <div>
              <h4>Cash on Delivery</h4>
              <p>Pay when the order arrives</p>
            </div>
          </div>
        </label>

        <label class="pay-card">
          <input type="radio" name="pay" value="online">
          <div class="content">
            <i class="fa-solid fa-credit-card"></i>
            <div>
              <h4>Pay Online</h4>
              <p>UPI / Cards / Wallets (Razorpay)</p>
            </div>
          </div>
        </label>

      </div>

    </div>

    <!-- SUMMARY SECTION -->
    <div class="summary-box">

      <h3>Order Summary</h3>

      <div class="summary-item" *ngFor="let i of cart.cartItems()">
        {{i.name}} × {{i.qty}}
        <span>₹{{ i.price * i.qty }}</span>
      </div>

      <hr>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>₹{{ cart.totalPrice() }}</span>
      </div>

      <div class="summary-row">
        <span>Shipping</span>
        <span class="free">FREE</span>
      </div>

      <div class="summary-total">
        <span>Total</span>
        <span>₹{{ cart.totalPrice() }}</span>
      </div>

      <button class="pay-btn" (click)="processPayment()">
        Place Order →
      </button>

      <div class="secure">
        <i class="fa-solid fa-shield-halved"></i>
        100% Secure Payments
      </div>

    </div>

  </div>

</section>
