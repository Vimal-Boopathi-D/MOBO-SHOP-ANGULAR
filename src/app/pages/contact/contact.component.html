<app-hero-banner
  [video]="'assets/videos/contact_us_video.mp4'"
  title="Expert Mobile Repair Services"
  description="Fast and affordable phone repairs by certified professionals."
></app-hero-banner>


<section class="contact-page">
  <h2>Contact Us</h2>
  <p class="subtitle">Have questions? Reach out to us!</p>

  <form (ngSubmit)="submitForm()" #contactForm="ngForm">
    <div class="form-group">
      <input type="text" placeholder="Your Name" [(ngModel)]="name" name="name" required>
    </div>
    <div class="form-group">
      <input type="email" placeholder="Your Email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="form-group">
      <textarea placeholder="Your Message" [(ngModel)]="message" name="message" required></textarea>
    </div>
    <button type="submit" [disabled]="!name || !email || !message">Send Message</button>
    <p class="success" *ngIf="submitted">Thank you! Your message has been sent.</p>
  </form>
</section>
