<section class="hero-slider">

  <div class="slide" 
       *ngFor="let slide of slides; let i = index"
       [class.active]="i === currentSlide">

    <!-- BACKGROUND -->
    <div class="slide-bg">
      <img [src]="slide.img" alt="{{ slide.title }}">
      <div class="overlay"></div>
    </div>

    <!-- LEFT SIDE CONTENT -->
    <div class="slide-left">
      <h1>{{ slide.title }}</h1>
      <p>{{ slide.subtitle }}</p>

<div class="btn-row">
  <button class="primary-btn" routerLink="/products">
    <i class="ri-store-2-line"></i> Explore Products
  </button>

        <button class="secondary-btn" routerLink="/contact">
          <i class="ri-phone-line"></i> Contact Us
        </button>
      </div>
    </div>

    <!-- RIGHT SIDE CONTENT (you can customize anything here) -->


  </div>

  <!-- SLIDER DOTS -->
  <div class="dots">
    <span *ngFor="let slide of slides; let i = index"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"></span>
  </div>

</section>
